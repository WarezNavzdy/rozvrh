<!DOCTYPE html>
<html lang="cs">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Rozvrh 1. LF UK</title>


  <style>

    :root {

      --navy: #0f172a;
      --navy-light: #1e293b;

      --blue: #38bdf8;
      --blue-dark: #0284c7;

      --bg: #f1f5f9;
      --card: #ffffff;

      --text: #0f172a;
      --muted: #64748b;

      --border: #e2e8f0;

      --radius: 14px;

    }


    * {
      box-sizing: border-box;
    }


    body {

      margin: 0;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);

      color: var(--text);

    }


    /* ==========================================
       HEADER
    ========================================== */

    header {

      background: var(--navy);

      color: white;

      position: sticky;

      top: 0;

      z-index: 100;

      box-shadow:
        0 2px 12px rgba(0, 0, 0, 0.15);

    }


    .nav {

      max-width: 1400px;

      margin: auto;

      padding: 0 24px;

      height: 68px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 20px;

    }


    .logo {

      display: flex;

      align-items: center;

      gap: 12px;

      color: white;

      text-decoration: none;

      font-size: 20px;

      font-weight: 700;

    }


    .logo-mark {

      width: 38px;

      height: 38px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      background: var(--blue);

      color: var(--navy);

      font-size: 14px;

      font-weight: 900;

    }


    .nav-info {

      color: #cbd5e1;

      font-size: 14px;

    }


    /* ==========================================
       MAIN
    ========================================== */

    main {

      max-width: 1400px;

      margin: auto;

      padding: 30px 24px 60px;

    }


    .page-header {

      margin-bottom: 25px;

    }


    .page-header h1 {

      margin: 0 0 7px;

      font-size: 32px;

      letter-spacing: -0.5px;

    }


    .page-header p {

      margin: 0;

      color: var(--muted);

    }


    /* ==========================================
       WEEK NAVIGATION
    ========================================== */

    .week-navigation {

      background: white;

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 14px;

      margin-bottom: 28px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 15px;

    }


    .week-button {

      border: 1px solid var(--border);

      background: white;

      color: var(--text);

      border-radius: 9px;

      padding: 10px 15px;

      font-size: 14px;

      font-weight: 650;

      cursor: pointer;

      transition: 0.15s;

      white-space: nowrap;

    }


    .week-button:hover:not(:disabled) {

      border-color: var(--blue);

      color: var(--blue-dark);

    }


    .week-button:disabled {

      opacity: 0.4;

      cursor: default;

    }


    .week-current {

      text-align: center;

      min-width: 180px;

    }


    .week-title {

      font-size: 19px;

      font-weight: 750;

    }


    .week-counter {

      margin-top: 3px;

      font-size: 12px;

      color: var(--muted);

    }


    /* ==========================================
       INFO
    ========================================== */

    .info-bar {

      background: white;

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 13px 17px;

      margin-bottom: 28px;

      display: flex;

      justify-content: space-between;

      align-items: center;

      gap: 15px;

    }


    .info-left {

      display: flex;

      align-items: center;

      gap: 9px;

      font-size: 14px;

      color: var(--muted);

    }


    .status {

      width: 9px;

      height: 9px;

      border-radius: 50%;

      background: #22c55e;

    }


    .updated {

      color: var(--muted);

      font-size: 13px;

      text-align: right;

    }


    /* ==========================================
       DAY
    ========================================== */

    .day {

      margin-bottom: 30px;

    }


    .day-header {

      display: flex;

      align-items: baseline;

      gap: 10px;

      margin-bottom: 10px;

    }


    .day-name {

      font-size: 22px;

      font-weight: 750;

    }


    .day-date {

      color: var(--muted);

      font-size: 15px;

    }


    .week-number {

      margin-left: auto;

      color: var(--muted);

      font-size: 13px;

      background: #e2e8f0;

      padding: 4px 8px;

      border-radius: 6px;

    }


    /* ==========================================
       SCHEDULE
    ========================================== */

    .schedule {

      background: var(--card);

      border: 1px solid var(--border);

      border-radius: var(--radius);

      overflow: hidden;

    }


    .lesson {

      display: grid;

      grid-template-columns: 105px 1fr;

      min-height: 96px;

      border-bottom: 1px solid var(--border);

    }


    .lesson:last-child {

      border-bottom: none;

    }


    /* ==========================================
       TIME
    ========================================== */

    .lesson-time {

      padding: 18px 15px;

      border-right: 1px solid var(--border);

      display: flex;

      flex-direction: column;

      justify-content: center;

    }


    .lesson-start {

      color: var(--text);

      font-size: 18px;

      font-weight: 750;

    }


    .lesson-end {

      color: var(--muted);

      font-size: 13px;

      margin-top: 3px;

    }


    /* ==========================================
       LESSON
    ========================================== */

    .lesson-body {

      padding: 15px 20px;

      border-left: 4px solid var(--lesson-color, var(--blue));

      display: flex;

      flex-direction: column;

      justify-content: center;

    }


    .lesson-top {

      display: flex;

      align-items: flex-start;

      justify-content: space-between;

      gap: 15px;

    }


    .lesson-subject {

      font-size: 18px;

      font-weight: 750;

    }


    .lesson-type {

      flex-shrink: 0;

      font-size: 11px;

      font-weight: 700;

      text-transform: uppercase;

      padding: 4px 7px;

      border-radius: 5px;

      background: #e0f2fe;

      color: #0369a1;

    }


    .lesson-teacher {

      margin-top: 5px;

      color: var(--muted);

      font-size: 14px;

    }


    /* ==========================================
       DETAILS
    ========================================== */

    .lesson-details {

      display: flex;

      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;

    }


    .detail {

      font-size: 12px;

      background: #f1f5f9;

      color: #475569;

      padding: 4px 7px;

      border-radius: 5px;

    }


    /* ==========================================
       EMPTY / LOADING / ERROR
    ========================================== */

    .loading,
    .error,
    .empty {

      background: white;

      border: 1px solid var(--border);

      border-radius: var(--radius);

      padding: 40px;

      text-align: center;

      color: var(--muted);

    }


    .error {

      color: #b91c1c;

      background: #fff7f7;

      border-color: #fecaca;

    }


    /* ==========================================
       MOBILE
    ========================================== */

    @media (max-width: 700px) {

      .nav {

        padding: 0 15px;

      }


      .nav-info {

        display: none;

      }


      main {

        padding: 20px 12px 40px;

      }


      .page-header h1 {

        font-size: 27px;

      }


      .week-navigation {

        padding: 10px;

      }


      .week-button {

        padding: 9px 10px;

        font-size: 13px;

      }


      .week-current {

        min-width: 0;

      }


      .week-title {

        font-size: 16px;

      }


      .info-bar {

        align-items: flex-start;

        flex-direction: column;

      }


      .updated {

        text-align: left;

      }


      .lesson {

        grid-template-columns: 78px 1fr;

      }


      .lesson-time {

        padding: 14px 10px;

      }


      .lesson-start {

        font-size: 16px;

      }


      .lesson-body {

        padding: 13px;

      }


      .lesson-top {

        flex-direction: column;

        gap: 7px;

      }


      .lesson-subject {

        font-size: 16px;

      }

    }

  </style>

</head>


<body>


  <!-- ==========================================
       HEADER
  ========================================== -->

  <header>

    <div class="nav">

      <a
        href="#"
        class="logo"
      >

        <span class="logo-mark">
          1L
        </span>

        <span>
          Rozvrh 1. LF UK
        </span>

      </a>


      <div class="nav-info">
        1. ročník · 1.LEK-a/1003
      </div>

    </div>

  </header>


  <!-- ==========================================
       MAIN
  ========================================== -->

  <main>


    <div class="page-header">

      <h1>
        Můj rozvrh
      </h1>

      <p>
        1. LF Univerzity Karlovy · 1. ročník
      </p>

    </div>


    <!-- ========================================
         PŘEPÍNÁNÍ TÝDNŮ
    ========================================= -->

    <div class="week-navigation">


      <button
        id="prevWeek"
        class="week-button"
        type="button"
      >
        ← Předchozí týden
      </button>


      <div class="week-current">

        <div
          id="weekTitle"
          class="week-title"
        >
          Načítám...
        </div>

        <div
          id="weekCounter"
          class="week-counter"
        >
        </div>

      </div>


      <button
        id="nextWeek"
        class="week-button"
        type="button"
      >
        Další týden →
      </button>


    </div>


    <!-- ========================================
         INFO
    ========================================= -->

    <div class="info-bar">


      <div class="info-left">

        <span class="status"></span>

        <span>
          Rozvrh načten ze SIS
        </span>

      </div>


      <div
        id="updated"
        class="updated"
      >
        Načítám...
      </div>


    </div>


    <!-- ========================================
         ROZVRH
    ========================================= -->

    <div id="app">

      <div class="loading">
        Načítám rozvrh...
      </div>

    </div>


  </main>


  <script>


    /*
     * ========================================================
     * URL CLOUDFLARE WORKERU
     * ========================================================
     */

    const WORKER_URL =
      "https://pytle.warezovaadresa.workers.dev/";


    /*
     * ========================================================
     * DATA
     * ========================================================
     */

    let schedule = [];

    let weeks = [];

    let currentWeekIndex = 0;


    /*
     * ========================================================
     * NAČTENÍ
     * ========================================================
     */

    async function loadSchedule() {

      const app =
        document.getElementById("app");


      try {


        app.innerHTML = `

          <div class="loading">

            Načítám rozvrh...

          </div>

        `;


        /*
         * Kontrola URL
         */

        if (
          !WORKER_URL ||
          WORKER_URL.includes("SEM_VLOŽ")
        ) {

          throw new Error(
            "Není nastavená URL Cloudflare Workeru."
          );

        }


        /*
         * Načtení Workeru
         */

        const response =
          await fetch(
            WORKER_URL,
            {
              method: "GET",
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `Worker vrátil HTTP ${response.status}`
          );

        }


        /*
         * JSON
         */

        const data =
          await response.json();


        /*
         * Kontrola
         */

        if (
          !data ||
          !Array.isArray(data.days)
        ) {

          throw new Error(
            "Worker nevrátil JSON s položkou 'days'."
          );

        }


        /*
         * Uložíme všechny dny
         */

        schedule =
          data.days;


        /*
         * ====================================================
         * VYTVOŘENÍ SEZNAMU TÝDNŮ
         * ====================================================
         *
         * Například:
         *
         * 1
         * 2
         * 3
         * 4
         * ...
         *
         */

        weeks = [
          ...new Set(
            schedule
              .map(
                day => day.week
              )
              .filter(
                week =>
                  week !== null &&
                  week !== undefined
              )
          )
        ].sort(
          (a, b) =>
            Number(a) - Number(b)
        );


        /*
         * Pokud Worker neposílá číslo týdne,
         * použijeme jednotlivé dny jako záložní řešení.
         */

        if (!weeks.length) {

          weeks =
            schedule.map(
              (_, index) =>
                index
            );

        }


        /*
         * ====================================================
         * VYBEREME PRVNÍ TÝDEN
         * ====================================================
         *
         * Tím pádem se po načtení zobrazí
         * první týden rozvrhu, tedy 29. 9.
         *
         */

        currentWeekIndex = 0;


        /*
         * Vykreslení
         */

        renderWeek();


        /*
         * Aktualizace
         */

        if (data.generatedAt) {

          const generated =
            new Date(
              data.generatedAt
            );


          document.getElementById(
            "updated"
          ).textContent =

            "Aktualizováno: " +

            generated.toLocaleString(
              "cs-CZ",
              {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }
            );

        } else {

          document.getElementById(
            "updated"
          ).textContent =
            "Rozvrh načten";

        }


      } catch (error) {


        console.error(
          "CHYBA:",
          error
        );


        app.innerHTML = `

          <div class="error">

            <strong>
              Chyba při načítání
            </strong>

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;


        document.getElementById(
          "weekTitle"
        ).textContent =
          "Chyba";


        document.getElementById(
          "weekCounter"
        ).textContent =
          "";


        document.getElementById(
          "updated"
        ).textContent =
          "Chyba při načítání";

      }

    }


    /*
     * ========================================================
     * VYKRESLENÍ AKTUÁLNÍHO TÝDNE
     * ========================================================
     */

    function renderWeek() {


      const app =
        document.getElementById("app");


      if (!schedule.length) {

        app.innerHTML = `

          <div class="empty">

            Rozvrh neobsahuje žádnou výuku.

          </div>

        `;

        return;

      }


      /*
       * Aktuální číslo týdne
       */

      const week =
        weeks[currentWeekIndex];


      /*
       * Najdeme všechny dny patřící
       * do aktuálního týdne.
       */

      let days =
        schedule.filter(
          day =>
            Number(day.week) ===
            Number(week)
        );


      /*
       * ====================================================
       * ZÁLOŽNÍ VARIANTA
       * ====================================================
       *
       * Kdyby Worker neměl week,
       * zobrazíme odpovídající den.
       *
       */

      if (
        !days.length &&
        schedule.length
      ) {

        days = [
          schedule[
            currentWeekIndex
          ]
        ].filter(Boolean);

      }


      /*
       * ----------------------------------------------------
       * Nadpis týdne
       * ----------------------------------------------------
       */

      document.getElementById(
        "weekTitle"
      ).textContent =

        `${week}. týden`;


      document.getElementById(
        "weekCounter"
      ).textContent =

        `Týden ${currentWeekIndex + 1} z ${weeks.length}`;


      /*
       * ----------------------------------------------------
       * Aktivace tlačítek
       * ----------------------------------------------------
       */

      document.getElementById(
        "prevWeek"
      ).disabled =

        currentWeekIndex === 0;


      document.getElementById(
        "nextWeek"
      ).disabled =

        currentWeekIndex ===
        weeks.length - 1;


      /*
       * ----------------------------------------------------
       * Když týden nemá výuku
       * ----------------------------------------------------
       */

      if (!days.length) {

        app.innerHTML = `

          <div class="empty">

            V tomto týdnu není žádná výuka.

          </div>

        `;

        return;

      }


      /*
       * ----------------------------------------------------
       * Vykreslení všech dnů týdne
       * ----------------------------------------------------
       */

      app.innerHTML =

        days
          .map(
            day =>
              renderDay(day)
          )
          .join("");

    }


    /*
     * ========================================================
     * VYKRESLENÍ DNE
     * ========================================================
     */

    function renderDay(day) {


      const classes =

        Array.isArray(day.classes)

          ? [...day.classes]

          : [];


      /*
       * Seřadíme hodiny podle začátku.
       */

      classes.sort(
        (a, b) =>

          timeToMinutes(a.start) -

          timeToMinutes(b.start)
      );


      return `

        <section class="day">


          <div class="day-header">


            <div class="day-name">

              ${escapeHtml(
                day.day || ""
              )}

            </div>


            <div class="day-date">

              ${escapeHtml(
                day.date || ""
              )}

            </div>


            <div class="week-number">

              ${escapeHtml(
                day.week ?? ""
              )}. týden

            </div>


          </div>


          <div class="schedule">


            ${
              classes.length

                ? classes
                    .map(
                      lesson =>
                        renderLesson(
                          lesson
                        )
                    )
                    .join("")

                : `

                  <div class="empty">

                    Tento den není žádná výuka.

                  </div>

                `
            }


          </div>


        </section>

      `;

    }


    /*
     * ========================================================
     * VYKRESLENÍ PŘEDMĚTU
     * ========================================================
     */

    function renderLesson(lesson) {


      const color =

        lesson.color ||

        "#38bdf8";


      return `

        <article
          class="lesson"
          style="
            --lesson-color:
            ${escapeHtml(color)}
          "
        >


          <div class="lesson-time">


            <div class="lesson-start">

              ${escapeHtml(
                lesson.start || "?"
              )}

            </div>


            ${
              lesson.end

                ? `

                  <div class="lesson-end">

                    ${escapeHtml(
                      lesson.end
                    )}

                  </div>

                `

                : ""
            }


          </div>


          <div class="lesson-body">


            <div class="lesson-top">


              <div class="lesson-subject">

                ${escapeHtml(
                  lesson.subject ||
                  "Neznámý předmět"
                )}

              </div>


              ${
                lesson.type

                  ? `

                    <div class="lesson-type">

                      ${escapeHtml(
                        lesson.type
                      )}

                    </div>

                  `

                  : ""
              }


            </div>


            ${
              lesson.teacher

                ? `

                  <div class="lesson-teacher">

                    ${escapeHtml(
                      lesson.teacher
                    )}

                  </div>

                `

                : ""
            }


            <div class="lesson-details">


              ${
                lesson.room

                  ? `

                    <span class="detail">

                      Místnost
                      ${escapeHtml(
                        lesson.room
                      )}

                    </span>

                  `

                  : ""
              }


              ${
                lesson.course

                  ? `

                    <span class="detail">

                      ${escapeHtml(
                        lesson.course
                      )}

                    </span>

                  `

                  : ""
              }


              ${
                lesson.durationMinutes

                  ? `

                    <span class="detail">

                      ${escapeHtml(
                        lesson.durationMinutes
                      )}
                      min

                    </span>

                  `

                  : ""
              }


              ${
                lesson.weekRange

                  ? `

                    <span class="detail">

                      ${escapeHtml(
                        lesson.weekRange.from
                      )}
                      –
                      ${escapeHtml(
                        lesson.weekRange.to
                      )}
                      . týden

                    </span>

                  `

                  : ""
              }


              ${
                lesson.subjectId

                  ? `

                    <span class="detail">

                      ${escapeHtml(
                        lesson.subjectId
                      )}

                    </span>

                  `

                  : ""
              }


            </div>


          </div>


        </article>

      `;

    }


    /*
     * ========================================================
     * PŘEDCHOZÍ TÝDEN
     * ========================================================
     */

    document
      .getElementById("prevWeek")
      .addEventListener(
        "click",
        () => {

          if (
            currentWeekIndex <= 0
          ) {

            return;

          }


          currentWeekIndex--;

          renderWeek();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    /*
     * ========================================================
     * DALŠÍ TÝDEN
     * ========================================================
     */

    document
      .getElementById("nextWeek")
      .addEventListener(
        "click",
        () => {

          if (
            currentWeekIndex >=
            weeks.length - 1
          ) {

            return;

          }


          currentWeekIndex++;

          renderWeek();

          window.scrollTo({
            top: 0,
            behavior: "smooth"
          });

        }
      );


    /*
     * ========================================================
     * ČAS → MINUTY
     * ========================================================
     */

    function timeToMinutes(time) {


      if (!time) {

        return 9999;

      }


      const match =

        String(time).match(
          /^(\d{1,2}):(\d{2})$/
        );


      if (!match) {

        return 9999;

      }


      return (

        Number(match[1]) * 60 +

        Number(match[2])

      );

    }


    /*
     * ========================================================
     * OCHRANA HTML
     * ========================================================
     */

    function escapeHtml(value) {


      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
     * ========================================================
     * START
     * ========================================================
     */

    loadSchedule();


  </script>


</body>

</html>
