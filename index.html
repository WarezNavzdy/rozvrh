<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Můj Rozvrh - Cloudflare API</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }
        h1 { text-align: center; color: #2c3e50; }
        .day-group {
            margin-top: 30px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-radius: 8px;
        }
        .day-title {
            background-color: #2c3e50;
            color: white;
            padding: 12px 15px;
            border-radius: 8px 8px 0 0;
            margin: 0;
            font-size: 1.2em;
            font-weight: bold;
        }
        .event {
            background: white;
            padding: 15px;
            border-bottom: 1px solid #eee;
            border-left: 1px solid #ddd;
            border-right: 1px solid #ddd;
        }
        .event:last-child {
            border-radius: 0 0 8px 8px;
            border-bottom: 1px solid #ddd;
        }
        .time {
            font-weight: bold;
            color: #333;
            margin-bottom: 8px;
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .subject {
            font-size: 1.15em;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .teacher, .room {
            font-size: 0.9em;
            color: #555;
            margin-bottom: 3px;
        }
        
        /* Barevné rozlišení výuky */
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.85em;
            font-weight: bold;
        }
        .badge-prednaska { background: #d0ebff; color: #1864ab; } /* Modrá */
        .badge-cviceni { background: #d3f9d8; color: #2b8a3e; }   /* Zelená */
        .badge-seminar { background: #ffe8cc; color: #d9480f; }   /* Oranžová */
        .badge-default { background: #f1f3f5; color: #495057; }   /* Šedá */
    </style>
</head>
<body>

    <h1>Můj Rozvrh</h1>
    <div id="schedule">Načítám data z API...</div>

    <script>
        // SEM VLOŽ ODKAZ NA SVŮJ CLOUDFLARE WORKER:
        const API_URL = 'https://TVUJ-WORKER.workers.dev/';

        function calculateEndTime(startTime, durationMinutes) {
            if (!startTime || !durationMinutes) return '';
            const [hours, minutes] = startTime.split(':').map(Number);
            const totalMinutes = hours * 60 + minutes + durationMinutes;
            const endHours = Math.floor(totalMinutes / 60);
            const endMinutes = totalMinutes % 60;
            return `${endHours}:${endMinutes.toString().padStart(2, '0')}`;
        }

        // Pomocná funkce pro přiřazení barvy podle typu výuky
        function getBadgeClass(type) {
            const t = type.toLowerCase();
            if (t.includes('přednáška')) return 'badge-prednaska';
            if (t.includes('cvičení')) return 'badge-cviceni';
            if (t.includes('seminář')) return 'badge-seminar';
            return 'badge-default';
        }

        const dayOrder = { "Po": 1, "Út": 2, "St": 3, "Čt": 4, "Pá": 5, "So": 6, "Ne": 7 };

        fetch(API_URL)
            .then(response => response.json())
            .then(data => {
                const container = document.getElementById('schedule');
                container.innerHTML = ''; 

                if (!data.success || !data.schedule || data.schedule.length === 0) {
                    container.innerHTML = '<p>Zatím žádná data nebo nastala chyba.</p>';
                    return;
                }

                const eventsByDay = {};
                data.schedule.forEach(event => {
                    const day = event.day || 'Neznámý den';
                    if (!eventsByDay[day]) eventsByDay[day] = [];
                    eventsByDay[day].push(event);
                });

                const sortedDays = Object.keys(eventsByDay).sort((a, b) => (dayOrder[a] || 99) - (dayOrder[b] || 99));

                sortedDays.forEach(day => {
                    eventsByDay[day].sort((a, b) => (a.time || "").localeCompare(b.time || ""));

                    const dayDiv = document.createElement('div');
                    dayDiv.className = 'day-group';
                    
                    const dayTitle = document.createElement('h2');
                    dayTitle.className = 'day-title';
                    dayTitle.innerText = day;
                    dayDiv.appendChild(dayTitle);

                    eventsByDay[day].forEach(event => {
                        const endTime = calculateEndTime(event.time, event.duration);
                        const timeString = event.time ? `${event.time} - ${endTime}` : 'Čas neurčen';
                        const badgeClass = getBadgeClass(event.type);
                        
                        const eventDiv = document.createElement('div');
                        eventDiv.className = 'event';
                        eventDiv.innerHTML = `
                            <div class="time">
                                <span>🕒 ${timeString}</span>
                                <span class="badge ${badgeClass}">${event.type}</span>
                            </div>
                            <div class="subject">${event.subject}</div>
                            <div class="room">📍 ${event.room || 'Místnost neuvedena'}</div>
                            <div class="teacher">👤 ${event.teacher || 'Vyučující neuveden'}</div>
                        `;
                        dayDiv.appendChild(eventDiv);
                    });

                    container.appendChild(dayDiv);
                });
            })
            .catch(error => {
                document.getElementById('schedule').innerHTML = `<p style="color:red;">Nepodařilo se připojit k API. Zkontroluj URL v kódu.</p>`;
                console.error(error);
            });
    </script>
</body>
</html>
