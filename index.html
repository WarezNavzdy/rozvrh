<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Rozvrh 1. LF UK</title>

  <style>
    :root {
      --navy: #0f172a;
      --navy-light: #1e293b;
      --blue: #38bdf8;
      --blue-dark: #0284c7;

      --bg: #f1f5f9;
      --card: #ffffff;

      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;

      --radius: 14px;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;

      font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

      background: var(--bg);
      color: var(--text);
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: var(--navy);
      color: white;

      position: sticky;
      top: 0;

      z-index: 100;

      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
    }

    .nav {
      max-width: 1400px;
      margin: auto;

      padding: 0 24px;

      height: 68px;

      display: flex;
      align-items: center;
      justify-content: space-between;

      gap: 20px;
    }

    .logo {
      display: flex;
      align-items: center;

      gap: 12px;

      color: white;
      text-decoration: none;

      font-size: 20px;
      font-weight: 700;
    }

    .logo-mark {
      width: 38px;
      height: 38px;

      border-radius: 50%;

      display: flex;
      align-items: center;
      justify-content: center;

      background: var(--blue);
      color: var(--navy);

      font-size: 14px;
      font-weight: 900;
    }

    .nav-info {
      color: #cbd5e1;
      font-size: 14px;
    }

    /* =========================
       MAIN
    ========================= */

    main {
      max-width: 1400px;
      margin: auto;

      padding: 30px 24px 60px;
    }

    .page-header {
      margin-bottom: 25px;
    }

    .page-header h1 {
      margin: 0 0 7px;

      font-size: 32px;
      letter-spacing: -0.5px;
    }

    .page-header p {
      margin: 0;

      color: var(--muted);
    }

    /* =========================
       INFO BAR
    ========================= */

    .info-bar {
      background: white;

      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 15px 18px;

      margin-bottom: 28px;

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 15px;
    }

    .info-left {
      display: flex;
      align-items: center;

      gap: 10px;

      font-size: 14px;
      color: var(--muted);
    }

    .status {
      width: 9px;
      height: 9px;

      border-radius: 50%;

      background: #22c55e;
    }

    .updated {
      color: var(--muted);

      font-size: 13px;

      text-align: right;
    }

    /* =========================
       LOADING / ERROR / EMPTY
    ========================= */

    .loading,
    .error,
    .empty {
      background: white;

      border: 1px solid var(--border);
      border-radius: var(--radius);

      padding: 40px;

      text-align: center;

      color: var(--muted);
    }

    .error {
      color: #b91c1c;

      background: #fff7f7;
      border-color: #fecaca;
    }

    /* =========================
       DAY
    ========================= */

    .day {
      margin-bottom: 30px;
    }

    .day-header {
      display: flex;
      align-items: baseline;

      gap: 10px;

      margin-bottom: 10px;
    }

    .day-name {
      font-size: 22px;
      font-weight: 750;
    }

    .day-date {
      color: var(--muted);

      font-size: 15px;
    }

    .week-number {
      margin-left: auto;

      color: var(--muted);

      font-size: 13px;

      background: #e2e8f0;

      padding: 4px 8px;

      border-radius: 6px;
    }

    /* =========================
       SCHEDULE
    ========================= */

    .schedule {
      background: var(--card);

      border: 1px solid var(--border);
      border-radius: var(--radius);

      overflow: hidden;
    }

    .lesson {
      display: grid;

      grid-template-columns: 105px 1fr;

      min-height: 96px;

      border-bottom: 1px solid var(--border);
    }

    .lesson:last-child {
      border-bottom: none;
    }

    /* =========================
       TIME
    ========================= */

    .lesson-time {
      padding: 18px 15px;

      border-right: 1px solid var(--border);

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .lesson-start {
      color: var(--text);

      font-size: 18px;
      font-weight: 750;
    }

    .lesson-end {
      color: var(--muted);

      font-size: 13px;

      margin-top: 3px;
    }

    /* =========================
       LESSON BODY
    ========================= */

    .lesson-body {
      padding: 15px 20px;

      border-left: 4px solid var(--lesson-color, var(--blue));

      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    .lesson-top {
      display: flex;

      align-items: flex-start;
      justify-content: space-between;

      gap: 15px;
    }

    .lesson-subject {
      font-size: 18px;
      font-weight: 750;
    }

    .lesson-type {
      flex-shrink: 0;

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;

      padding: 4px 7px;

      border-radius: 5px;

      background: #e0f2fe;
      color: #0369a1;
    }

    .lesson-teacher {
      margin-top: 5px;

      color: var(--muted);

      font-size: 14px;
    }

    /* =========================
       DETAILS
    ========================= */

    .lesson-details {
      display: flex;
      flex-wrap: wrap;

      gap: 8px;

      margin-top: 10px;
    }

    .detail {
      font-size: 12px;

      background: #f1f5f9;
      color: #475569;

      padding: 4px 7px;

      border-radius: 5px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {

      .nav {
        padding: 0 15px;
      }

      .nav-info {
        display: none;
      }

      main {
        padding: 20px 12px 40px;
      }

      .page-header h1 {
        font-size: 27px;
      }

      .info-bar {
        align-items: flex-start;

        flex-direction: column;
      }

      .updated {
        text-align: left;
      }

      .lesson {
        grid-template-columns: 78px 1fr;
      }

      .lesson-time {
        padding: 14px 10px;
      }

      .lesson-start {
        font-size: 16px;
      }

      .lesson-body {
        padding: 13px;
      }

      .lesson-top {
        flex-direction: column;

        gap: 7px;
      }

      .lesson-subject {
        font-size: 16px;
      }

      .week-number {
        font-size: 12px;
      }
    }
  </style>
</head>

  </header>


  <!-- ==========================================
       MAIN

  <main>

    <div class="page-header">

      <h1>
        Můj rozvrh
      </h1>

      <p>
        1. LF Univerzity Karlovy · 1. ročník
      </p>

    </div>


    <!-- ========================================
         INFO
    ========================================= -->

    <div class="info-bar">

      <div class="info-left">

        <span class="status"></span>

        <span>
          Rozvrh načten ze SIS
        </span>

      </div>


      <div
        id="updated"
        class="updated"
      >
        Načítám...
      </div>

    </div>


    <!-- ========================================
         ROZVRH
    ========================================= -->

    <div id="app">

      <div class="loading">
        Načítám rozvrh...
      </div>

    </div>

  </main>


  <!-- ==========================================
       JAVASCRIPT
  =========================================== -->

  <script>

    /*
     * ========================================================
     * SEM VLOŽ URL TVÉHO CLOUDFLARE WORKERU
     * ========================================================
     */

    const WORKER_URL =
      "https://pytle.warezovaadresa.workers.dev/";


    /*
     * ========================================================
     * DATA
     * ========================================================
     */

    let schedule = [];


    /*
     * ========================================================
     * NAČTENÍ ROZVRHU
     * ========================================================
     */

    async function loadSchedule() {

      const app =
        document.getElementById("app");


      try {

        app.innerHTML = `
          <div class="loading">
            Načítám rozvrh...
          </div>
        `;


        const response =
          await fetch(
            WORKER_URL,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        /*
         * ----------------------------------------------------
         * VEZMEME VŠECHNY DNY Z WORKERU
         * ----------------------------------------------------
         */

        schedule =
          Array.isArray(data.days)
            ? data.days
            : [];


        /*
         * ----------------------------------------------------
         * VYKRESLENÍ
         * ----------------------------------------------------
         */

        renderSchedule();


        /*
         * ----------------------------------------------------
         * DATUM AKTUALIZACE
         * ----------------------------------------------------
         */

        if (data.generatedAt) {

          const generated =
            new Date(
              data.generatedAt
            );


          document.getElementById(
            "updated"
          ).textContent =
            "Aktualizováno: " +
            generated.toLocaleString(
              "cs-CZ",
              {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",
                hour: "2-digit",
                minute: "2-digit"
              }
            );

        } else {

          document.getElementById(
            "updated"
          ).textContent =
            "Rozvrh načten";

        }


      } catch (error) {

        console.error(
          "Chyba při načítání:",
          error
        );


        app.innerHTML = `

          <div class="error">

            <strong>
              Nepodařilo se načíst rozvrh.
            </strong>

            <br><br>

            ${escapeHtml(
              error.message
            )}

          </div>

        `;


        document.getElementById(
          "updated"
        ).textContent =
          "Chyba při načítání";

      }

    }


    /*
     * ========================================================
     * VYKRESLENÍ CELÉHO ROZVRHU
     * ========================================================
     */

    function renderSchedule() {

      const app =
        document.getElementById("app");


      if (
        !schedule ||
        schedule.length === 0
      ) {

        app.innerHTML = `

          <div class="empty">

            Rozvrh neobsahuje žádnou výuku.

          </div>

        `;

        return;

      }


      /*
       * ----------------------------------------------------
       * DŮLEŽITÉ:
       *
       * TADY UŽ NENÍ ŽÁDNÉ FILTROVÁNÍ PODLE TÝDNE.
       *
       * ZOBRAZÍME VŠECHNY DNY, KTERÉ VRÁTÍ WORKER.
       * ----------------------------------------------------
       */

      app.innerHTML =
        schedule
          .map(
            day =>
              renderDay(day)
          )
          .join("");

    }


    /*
     * ========================================================
     * VYKRESLENÍ JEDNOHO DNE
     * ========================================================
     */

    function renderDay(day) {

      /*
       * Zkopírujeme hodiny, abychom
       * neměnili původní JSON.
       */

      const classes =
        Array.isArray(day.classes)
          ? [...day.classes]
          : [];


      /*
       * ----------------------------------------------------
       * PŘEDMĚTY SEŘADÍME PODLE ČASU
       * ----------------------------------------------------
       */

      classes.sort(
        (a, b) => {

          return (
            timeToMinutes(a.start) -
            timeToMinutes(b.start)
          );

        }
      );


      /*
       * ----------------------------------------------------
       * DEN
       * ----------------------------------------------------
       */

      return `

        <section class="day">


          <div class="day-header">

            <div class="day-name">

              ${escapeHtml(
                day.day || ""
              )}

            </div>


            <div class="day-date">

              ${escapeHtml(
                day.date || ""
              )}

            </div>


            ${
              day.week !== null &&
              day.week !== undefined
                ? `

                  <div class="week-number">

                    ${escapeHtml(
                      day.week
                    )}. týden

                  </div>

                `
                : ""
            }

          </div>


          <div class="schedule">

            ${
              classes.length > 0

                ? classes
                    .map(
                      lesson =>
                        renderLesson(
                          lesson
                        )
                    )
                    .join("")

                : `

                  <div class="empty">

                    Tento den není žádná výuka.

                  </div>

                `
            }

          </div>


        </section>

      `;

    }


    /*
     * ========================================================
     * VYKRESLENÍ JEDNÉ HODINY
     * ========================================================
     */

    function renderLesson(lesson) {

      const color =
        lesson.color ||
        "#38bdf8";


      return `

        <article
          class="lesson"
          style="--lesson-color: ${escapeHtml(color)}"
        >


          <!-- ČAS -->

          <div class="lesson-time">

            <div class="lesson-start">

              ${escapeHtml(
                lesson.start || "?"
              )}

            </div>


            ${
              lesson.end

                ? `

                  <div class="lesson-end">

                    ${escapeHtml(
                      lesson.end
                    )}

                  </div>

                `

                : ""
            }

          </div>


          <!-- INFORMACE O PŘEDMĚTU -->

          <div class="lesson-body">


            <div class="lesson-top">


              <div class="lesson-subject">

                ${escapeHtml(
                  lesson.subject ||
                  "Neznámý předmět"
                )}

              </div>


              ${
                lesson.type

                  ? `

                    <div class="lesson-type">

                      ${escapeHtml(
                        lesson.type
                      )}

                    </div>

                  `

                  : ""
              }

            </div>


            ${
              lesson.teacher

                ? `

                  <div class="lesson-teacher">

                    ${escapeHtml(
                      lesson.teacher
                    )}

                  </div>

                `

                : ""
            }


            <div class="lesson-details">


              ${
                lesson.room

                  ? `

                    <span class="detail">

                      Místnost
                      ${escapeHtml(
                        lesson.room
                      )}

                    </span>

                  `

                  : ""
              }


              ${
                lesson.course

                  ? `

                    <span class="detail">

                      ${escapeHtml(
                        lesson.course
                      )}

                    </span>

                  `

                  : ""
              }


              ${
                lesson.durationMinutes

                  ? `

                    <span class="detail">

                      ${escapeHtml(
                        lesson.durationMinutes
                      )}
                      min

                    </span>

                  `

                  : ""
              }


              ${
                lesson.weekRange

                  ? `

                    <span class="detail">

                      ${escapeHtml(
                        lesson.weekRange.from
                      )}
                      –
                      ${escapeHtml(
                        lesson.weekRange.to
                      )}
                      . týden

                    </span>

                  `

                  : ""
              }


              ${
                lesson.subjectId

                  ? `

                    <span class="detail">

                      ${escapeHtml(
                        lesson.subjectId
                      )}

                    </span>

                  `

                  : ""
              }


            </div>


          </div>


        </article>

      `;

    }


    /*
     * ========================================================
     * PŘEVOD ČASU NA MINUTY
     * ========================================================
     */

    function timeToMinutes(time) {

      if (!time) {
        return 9999;
      }


      const match =
        String(time).match(
          /^(\d{1,2}):(\d{2})$/
        );


      if (!match) {
        return 9999;
      }


      return (
        Number(match[1]) * 60 +
        Number(match[2])
      );

    }


    /*
     * ========================================================
     * OCHRANA PŘED HTML
     * ========================================================
     */

    function escapeHtml(value) {

      return String(
        value ?? ""
      )

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    /*
     * ========================================================
     * START
     * ========================================================
     */

    loadSchedule();

  </script>

</body>
</html>
